
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benim Web Sitem</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    header {
      padding: 24px 8%;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }

    main {
      max-width: 850px;
      margin: 90px auto;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 16px;
    }

    p {
      color: #64748b;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <strong>Benim Web Sitem</strong>
  </header>

  <main>
    <h1>Merhaba, dünyaya hoş geldin!</h1>
    <p>
      Bu web sitesini GitHub Pages kullanarak
      ücretsiz olarak yayınladım.
    </p>
    <a href="https://github.com/" target="_blank"
       rel="noopener noreferrer">
      GitHub'ı Keşfet
    </a>
  </main>
</body>
</html>
